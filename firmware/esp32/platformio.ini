; Limen slave per ESP32-S3 (provato come logica su PC contro il master; questo progetto va compilato
; con PlatformIO: estensione di VS Code, poi «Build» e «Upload»).
; «pio run» costruisce il firmware completo: BLE + NFC telefono + DESFire + badge (un solo binario).
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; C++17 per il core
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINOJSON_USE_LONG_LONG=1
    -DLIMEN_BLE_CRED=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    h2zero/NimBLE-Arduino@1.4.3

; Nome storico: identico alla build di default (credenziale telefono BLE gia' inclusa in esp32s3).
[env:esp32s3_blecred]
extends = env:esp32s3
