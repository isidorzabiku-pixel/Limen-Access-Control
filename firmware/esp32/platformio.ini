; Limen slave per ESP32-S3 (provato come logica su PC contro il master; questo progetto va compilato
; con PlatformIO: estensione di VS Code, poi «Build» e «Upload»).
; «pio run» costruisce solo il firmware normale; quello BLE si sceglie con -e esp32s3_ble
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
; C++17 per il core
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINOJSON_USE_LONG_LONG=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

; Firmware di PROVA con lettore BLE (app generica sul telefono, nessuna autenticazione): solo per il banco.
; Stesso firmware di sopra piu' src/ble_test.*; «pio run -e esp32s3_ble -t upload».
[env:esp32s3_ble]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DLIMEN_BLE_TEST=1
lib_deps =
    ${env:esp32s3.lib_deps}
    h2zero/NimBLE-Arduino@1.4.3

; Firmware con lettore BLE a credenziale del telefono (sfida + HMAC con segreto per telefono, abbinamento con invito dell'admin, senza approvazione).
; «pio run -e esp32s3_blecred -t upload». Non usa ble_test.*.
[env:esp32s3_blecred]
extends = env:esp32s3
build_flags =
    ${env:esp32s3.build_flags}
    -DLIMEN_BLE_CRED=1
lib_deps =
    ${env:esp32s3.lib_deps}
    h2zero/NimBLE-Arduino@1.4.3
